{% extends "base.html" %}

{% block title %}Change Password | Food_Ex{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm p-4">
                <h1 class="h3 mb-4">Change password</h1>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                            <input class="form-control" type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}" required>
                            {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
                        </div>
                    {% endfor %}
                    <button class="btn btn-danger w-100" type="submit">Save password</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
