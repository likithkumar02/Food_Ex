{% extends "base.html" %}

{% block title %}Payment | Food_Ex{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm p-4">
                <h2 class="mb-4">Payment</h2>
                <p class="text-muted">Order total: ₹{{ order.total_price }}</p>
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
                {% endfor %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="payment_method" class="form-label">Payment Method</label>
                        <select class="form-select" id="payment_method" name="payment_method">
                            <option value="cod">Cash on Delivery</option>
                            {% if test_payment_enabled %}<option value="test">Development Test Payment</option>{% endif %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Place order</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
